group 'io.flutter.plugins.inapppurchase'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    flavorDimensions 'billingMode'

    productFlavors {
        play {
            dimension 'billingMode'
        }
        disabled {
            dimension 'billingMode'
        }
    }

    buildFeatures {
        buildConfig true
    }

    namespace 'io.flutter.plugins.inapppurchase'

    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        minSdk 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        checkAllWarnings true
        warningsAsErrors true
        disable 'AndroidGradlePluginVersion', 'InvalidPackage', 'GradleDependency', 'NewerVersionAvailable'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }

}

// 两套实现共用相同 FQCN；每个变体只能将其对应实现传给 javac。
def isSelectedMainSource = { File sourceFile, boolean useGoogleBillingClient ->
    def sourcePath = sourceFile.path.replace('\\', '/')
    if (useGoogleBillingClient) {
        return !sourcePath.contains('/src/main/java/io/flutter/plugins/inapppurchase_noop/')
    }
    if (sourcePath.contains('/src/main/java/io/flutter/plugins/inapppurchase_noop/')) {
        return true
    }
    if (sourcePath.contains('/src/main/java/io/flutter/plugins/inapppurchase/')) {
        return sourcePath.endsWith('/Messages.java')
    }
    return true
}

def isSelectedUnitTestSource = { File sourceFile, boolean useGoogleBillingClient ->
    def sourcePath = sourceFile.path.replace('\\', '/')
    def isNoopTest = sourcePath.endsWith(
        '/src/test/java/io/flutter/plugins/inapppurchase/NoopInAppPurchaseApiTest.java')
    if (useGoogleBillingClient) {
        return !isNoopTest
    }
    return isNoopTest || !sourcePath.contains('/src/test/java/')
}

afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        def useGoogleBillingClient = name.contains('Play')
        if (name.matches('compile.*UnitTestJavaWithJavac')) {
            setSource(source.filter { sourceFile ->
                isSelectedUnitTestSource(sourceFile, useGoogleBillingClient)
            })
        } else if (name.matches('compile(?!.*AndroidTest).*JavaWithJavac')) {
            setSource(source.filter { sourceFile ->
                isSelectedMainSource(sourceFile, useGoogleBillingClient)
            })
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.9.0'
    playImplementation 'com.android.billingclient:billing:9.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'org.mockito:mockito-core:5.17.0'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
